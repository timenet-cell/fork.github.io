<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<title>Page not found · Fork</title>
<script>
// GitHub Pages so serve /r/ e /l/ (index.html); /l/<release> vai para /l/?r=<release> com o #h=…&e=…; /r/<id> cai aqui. Manda para /r/?e=<id>, mantendo ?licence= e o #sha256=.
(function(){
  var l = /^\/l\/([0-9a-f-]{36})\/?$/.exec(location.pathname);
  if (l) { location.replace('/l/?r=' + l[1] + location.hash); return; }
  var m = /^\/r\/([A-Za-z0-9_-]{1,64})\/?$/.exec(location.pathname);
  if (!m) return;
  var rest = location.search ? '&' + location.search.slice(1) : '';
  location.replace('/r/?e=' + encodeURIComponent(m[1]) + rest + location.hash);
})();
</script>
<style>
:root{--bg:#EEF3F8;--text:#141A22;--muted:#5B6675;--red:#e0312a;color-scheme:light dark}
@media (prefers-color-scheme: dark){:root{--bg:#0F141B;--text:#E8EDF3;--muted:#9AA6B4;--red:#ff5a4f}}
body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:16px;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;text-align:center}
h1{font-size:22px;margin:0 0 6px} p{color:var(--muted);margin:0 0 12px} a{color:var(--red)}
</style>
<style>:root[data-beta]{--red:#00a36c!important}.beta-pill{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:9999;font:600 12px/1 -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;background:#00a36c;color:#fff;padding:8px 12px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.18)}.beta-pill a{color:#fff;margin-left:8px;text-decoration:underline}</style>
<script>
// Pre-visualizacao da beta (o verde Jade das builds): ?beta liga, ?beta=0 desliga; fica na sessao deste separador.
(function(){try{var q=new URLSearchParams(location.search),s=sessionStorage;if(q.has('beta'))q.get('beta')==='0'?s.removeItem('fork-beta'):s.setItem('fork-beta','1');if(s.getItem('fork-beta')){document.documentElement.setAttribute('data-beta','');document.addEventListener('DOMContentLoaded',function(){var p=document.createElement('div');p.className='beta-pill';p.innerHTML='Beta preview<a href="?beta=0">Exit</a>';document.body.appendChild(p);});}}catch(e){}})();
</script>
</head>
<body><main><h1>Page not found</h1><p>This address doesn't exist on forkgate.io.</p><a href="/">Back to Fork</a></main></body>
</html>
