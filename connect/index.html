<style>
:root{--bg:#f6f1e7;--card:#fffdf8;--text:#1d1b18;--muted:#6f6a62;--line:#e6dfd2;--red:#e0312a;--red-ink:#fff;--field:#fff;--err:#b3261e}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
main{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.card{width:100%;max-width:380px;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:32px 24px;box-shadow:0 10px 40px rgba(0,0,0,.06)}
.mark{width:56px;height:56px;margin:0 auto 14px;display:block}
h1{font-size:22px;font-weight:650;text-align:center;margin:0 0 4px;letter-spacing:-.01em}

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const $ = id => document.getElementById(id), log = m => { $('log').textContent += new Date().toLocaleTimeString() + ' ' + m + '\n'; };
const uuid = () => crypto.randomUUID();
const ls = { get: k => { try { return localStorage.getItem(k) } catch { return null } }, set: (k, v) => { try { localStorage.setItem(k, v) } catch {} }, del: k => { try { localStorage.removeItem(k) } catch {} } };
const deviceId = ls.get('fork-p2p-device') || (ls.set('fork-p2p-device', uuid()), ls.get('fork-p2p-device')) || uuid();
$('email').value = ls.get('fork-p2p-email') || '';
const SUPABASE_URL = "https://bxxscrkhcqdxgdhiuuoa.supabase.co";
const SUPABASE_KEY = "sb_publishable_iHR-1zNUsvPyL1czbALDmA_zCTW8Pd7";  // publishable key: public by design (same as the landing page); access is enforced by Supabase row-level security
const STUN = [{ urls: ['stun:stun.l.google.com:19302', 'stun:stun.cloudflare.com:3478'] }];
const rtLog = [];
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: true, autoRefreshToken: true },
  // O que o cliente do Realtime diz (fecho do socket com codigo, erros, heartbeats): e o que explica o CLOSED/CHANNEL_ERROR.

let authEv = '-', canalEstado = '-', ultimoErro = '-', channel, uid, hosts = {}, conn = null, auto = true, esperaMacs = null;
sb.auth.onAuthStateChange((ev, ses) => { authEv = ev + (ses ? ' (token exp in ' + (ses.expires_at - Math.floor(Date.now() / 1000)) + ' s)' : ''); log('auth: ' + authEv); });
const msg = (t, erro) => { $('st').className = 'msg' + (erro ? ' err' : ''); $('st').textContent = t || ''; };
const mostra = quem => { $('cfg').classList.toggle('hidden', quem !== 'cfg'); $('app').classList.toggle('hidden', quem !== 'app'); };

// ── PWA: casca offline e dica de instalacao ─────────────────────────────────────────────────────────────
let swErro = '';
const BUILD = '2026-10-15i-speed';
function toastAtualizado() {
  if ($('toast')) return;
  const t = document.createElement('div'); t.id = 'toast';
  t.style.cssText = 'position:fixed;left:16px;right:16px;bottom:16px;max-width:380px;margin:auto;background:var(--text);color:var(--bg);padding:12px 14px;border-radius:12px;font-size:14px;display:flex;gap:12px;align-items:center;justify-content:space-between;z-index:9';
  t.innerHTML = '<span>Updated.</span><button style="width:auto;margin:0;padding:6px 12px" id="toast-r">Reload</button>';
  document.body.appendChild(t); $('toast-r').onclick = () => location.reload();
}
if ('serviceWorker' in navigator) {
  const tinhaControlo = !!navigator.serviceWorker.controller;
  // Uma versao nova do sw.js assume o controlo: avisa-se (nao se recarrega a meio de uma ligacao).
  navigator.serviceWorker.addEventListener('controllerchange', () => { if (tinhaControlo) toastAtualizado(); });
  navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => r.update()).catch(e => { swErro = String(e.message || e); log('sw: ' + e); });
}
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone;
let instalar = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); instalar = e; dica(); });
function dica() {
  if (standalone || ls.get('fork-p2p-hint')) return;
  const ios = /iphone|ipad|ipod/i.test(navigator.userAgent), h = $('hint');
  if (ios) h.innerHTML = 'Add Fork to your Home Screen: tap <b>Share</b>, then <b>Add to Home Screen</b>.<br><button class="sec" id="hint-ok">Got it</button>';
  else if (instalar) h.innerHTML = 'Install Fork on this phone for one-tap access.<br><button id="hint-in">Install</button><button class="sec" id="hint-ok">Not now</button>';
  else return;
  h.classList.remove('hidden');
  $('hint-ok').onclick = () => { ls.set('fork-p2p-hint', '1'); h.classList.add('hidden'); };
  if ($('hint-in')) $('hint-in').onclick = async () => { instalar.prompt(); await instalar.userChoice; ls.set('fork-p2p-hint', '1'); h.classList.add('hidden'); };
}
dica();

// ── entrar ─────────────────────────────────────────────────────────────────────────────────────────────────
$('in').onclick = async () => {
  ls.set('fork-p2p-email', $('email').value.trim());
  const login = $('email').value.trim(), password = $('pw').value;
  let error;
  $('in').disabled = true; msg('Signing in\u2026');
  if (login.includes('@')) {
    ({ error } = await sb.auth.signInWithPassword({ email: login, password }));
  } else {
    // A username: a funcao `sign-in` procura o email do lado do servidor (nunca o devolve) e devolve a sessao.
    const r = await fetch(SUPABASE_URL + '/functions/v1/sign-in', { method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY }, body: JSON.stringify({ login, password }) }).catch(() => null);
    const out = r ? await r.json().catch(() => ({})) : {};
    if (!r) error = { message: 'Can\u2019t reach Fork. Check your connection.' };
    else if (!r.ok) error = { message: out.error === 'rate_limited' ? 'Too many attempts. Try again in a few minutes.' : 'Username or password is incorrect.' };
    else ({ error } = await sb.auth.setSession({ access_token: out.access_token, refresh_token: out.refresh_token }));
  }
  $('pw').value = ''; $('in').disabled = false;
  if (error) { msg(error.message, true); return log('sign-in: ' + error.message); }
  msg(''); arranca();
};
$('out').onclick = async () => { ls.del('fork-p2p-last'); if (conn) conn.pc.close(); conn = null; if (channel) await sb.removeChannel(channel); channel = null; await sb.auth.signOut(); mostra('cfg'); msg(''); };

// ── os Macs e a ligacao ─────────────────────────────────────────────────────────────────────────────────────
async function arranca() {
  const { data } = await sb.auth.getSession();
  if (!data.session) { mostra('cfg'); return; }
  uid = data.session.user.id; mostra('app'); auto = true; hosts = {};
  sb.realtime.setAuth(data.session.access_token);
  if (channel) await sb.removeChannel(channel);
  channel = sb.channel('rtc:' + uid, { config: { private: true, broadcast: { self: false }, presence: { key: deviceId, enabled: true } } });
  channel.on('presence', { event: 'sync' }, sync);
  for (const ev of ['answer', 'ice', 'bye']) channel.on('broadcast', { event: ev }, ({ payload }) => onSignal(payload));
  channel.subscribe((s, err) => { canalEstado = s; if (err) ultimoErro = String(err.message || err); log('channel: ' + s + (err ? ' ' + (err.message || err) : '')); if ((s === 'CHANNEL_ERROR' || s === 'TIMED_OUT') && !(conn && conn.pc.connectionState === 'connected')) msg('Can\u2019t reach Fork right now. Retrying\u2026', true); });
  if (!navigator.onLine) return msg('You\u2019re offline. Your Mac is unreachable.', true);
  msg('Looking for your Mac\u2026');
  clearTimeout(esperaMacs);
  esperaMacs = setTimeout(() => { if (!Object.keys(hosts).length && !conn) msg('Your Mac is unreachable. Make sure it\u2019s awake, online, and \u201cUse Fork P2P Network\u201d is on in its Settings.', true); }, 8000);
}
function sync() {
  hosts = {};
  log('presence sync: ' + JSON.stringify(Object.keys(channel.presenceState())));
  for (const [k, metas] of Object.entries(channel.presenceState())) { const m = metas[metas.length - 1]; if (m && m.role === 'host') hosts[k] = m; }
  const ids = Object.keys(hosts), ultimo = ls.get('fork-p2p-last');
  // Entra direto no ultimo Mac usado; sem ultimo, so se houver um unico. A lista so aparece com 2+ (ou se o ultimo esta desligado).
  if (auto && !conn) {
    const alvo = ultimo && hosts[ultimo] ? ultimo : (!ultimo && ids.length === 1 ? ids[0] : null);
    if (alvo) { auto = false; connect(alvo); return; }
  }
  $('macs').innerHTML = '';
  for (const id of ids) {
    const d = document.createElement('div'); d.className = 'mac'; d.innerHTML = '<span></span><button>Connect</button>';
    d.firstChild.textContent = hosts[id].name || id.slice(0, 8); d.lastChild.onclick = () => connect(id); $('macs').appendChild(d);
  }
  if (!ids.length) $('macs').textContent = ultimo ? 'Your Mac is offline.' : 'No Mac online. Turn on \u201cUse Fork P2P Network\u201d in the Mac app (Settings \u2192 Advanced \u2192 Network).';
  else if (!conn) msg(ids.length > 1 || ultimo ? 'Choose a Mac.' : '');
}

const sig = (kind, to, extra = {}) => channel.send({ type: 'broadcast', event: kind, payload: { v: 1, kind, conn: conn.id, from: deviceId, to, ts: Math.floor(Date.now() / 1000), ...extra } });

async function connect(hostId, reintento) {
  $('retry').classList.add('hidden');
  if (conn) conn.pc.close();
  const nome = hosts[hostId]?.name || hostId.slice(0, 8);
  const pc = new RTCPeerConnection({ iceServers: STUN });
  conn = { id: uuid(), host: hostId, pc, res: {}, t0: performance.now(), nome, aberto: false, reintento: !!reintento };
  const c = conn, dc = pc.createDataChannel('api'); c.dc = dc; dc.binaryType = 'arraybuffer';
  pc.onicecandidate = e => { if (e.candidate && conn === c) sig('ice', hostId, { candidate: { candidate: e.candidate.candidate, sdp_mid: e.candidate.sdpMid, sdp_mline_index: e.candidate.sdpMLineIndex } }); };
  pc.onconnectionstatechange = () => {
    log('pc: ' + pc.connectionState + ' (' + Math.round(performance.now() - c.t0) + ' ms)');
    if (conn !== c) return;
    if (pc.connectionState === 'connected') msg(c.aberto2 ? '' : 'Connected to ' + nome);
    else if (pc.connectionState === 'connecting') msg('Connecting to ' + nome + '\u2026');
    else if (pc.connectionState === 'disconnected') {
      // Passageiro (uma rajada que enche a ligacao, uma pausa do Wi-Fi): espera-se 12 s antes de desistir.
      msg('Reconnecting to ' + nome + '\u2026', true);
      setTimeout(() => { if (conn === c && pc.connectionState === 'disconnected') pc.close(); }, 12000);
    }
    else if (['failed', 'closed'].includes(pc.connectionState)) {
      tunelFecha(c, 'The connection to your Mac dropped.'); document.body.classList.remove('mac');
      falhou(c.aberto ? 'The connection to ' + nome + ' dropped.' : 'Couldn\u2019t connect to ' + nome + '. Your network may block direct connections.');
    }
  };
  dc.onclose = () => log('dc closed (pc ' + pc.connectionState + ', ice ' + pc.iceConnectionState + ')');
  dc.onerror = e => log('dc error: ' + ((e.error && e.error.message) || 'unknown'));
  pc.oniceconnectionstatechange = () => log('ice: ' + pc.iceConnectionState);
  dc.onopen = () => { c.aberto = true; c.pingT = setInterval(() => { try { if (dc.readyState === 'open') dc.send('{"t":"ping"}'); } catch {} }, 5000); caminho(pc); ls.set('fork-p2p-last', hostId); log('data channel open'); sondaEAbre(c, nome); };
  dc.onmessage = e => tunelResposta(c, e.data);
  msg('Connecting to ' + nome + '\u2026');
  const offer = await pc.createOffer(); await pc.setLocalDescription(offer);
  await sig('offer', hostId, { sdp: offer.sdp });
  log('offer sent to ' + nome);
  // Sem resposta em 10 s: oferece-se outra vez (uma vez); depois diz-se, com o motivo se o Mac o deu.
  setTimeout(() => {
    if (conn !== c || pc.connectionState === 'connected' || c.recebeuResposta) return;
    if (!c.reintento) { log('no answer in 10 s — offering again'); connect(hostId, true); return; }
    falhou('Your Mac didn’t answer.' + (c.motivo ? ' (' + c.motivo + ')' : ' Is it awake and online, with the Fork app open?'));
  }, 10000);
}
// ── o tunel: o Studio do Mac num iframe; os pedidos dele passam pelo service worker e por este canal ─────────
let tid = 0;
const MAX_PEDIDOS = 6;     // pedidos do tunel em voo ao mesmo tempo (o resto espera: uma rajada de 20 ficheiros enche a ligacao)
function tunelPede(c, m, port) {
  if (!c.dc || c.dc.readyState !== 'open') { port.postMessage({ t: 'err', msg: 'Not connected to your Mac.' }); return; }
  const id = 't' + (++tid);
  (c.fila ||= []).push({ id, m, port });
  c.ativos = c.ativos || 0;
  port.onmessage = ev => {
    if (!(ev.data && ev.data.t === 'cancel')) return;
    const i = c.fila.findIndex(x => x.id === id);
    if (i >= 0) { c.fila.splice(i, 1); return; }                                  // ainda na fila: nunca chegou a sair
    if (c.pend && c.pend[id]) { delete c.pend[id]; c.ativos--; try { c.dc.send(JSON.stringify({ t: 'cancel', id })); } catch {} bomba(c); }
  };
  bomba(c);
}
function bomba(c) {
  while (c.ativos < MAX_PEDIDOS && c.fila && c.fila.length && c.dc && c.dc.readyState === 'open') {
    const { id, m, port } = c.fila.shift();
    (c.pend ||= {})[id] = port; c.ativos++;
    (c.info ||= {})[id] = { path: m.path, t: performance.now(), bytes: 0 };
    if (tid <= 40 || tid % 25 === 0) log('tunnel \u2192 ' + id + ' ' + m.method + ' ' + m.path.slice(0, 70));
    c.dc.send(JSON.stringify({ t: 'req', id, method: m.method, path: m.path, headers: m.headers || {}, body: m.body || null, bin: true, gz: typeof DecompressionStream === 'function' }));
  }
}
function tunelFim(c, id) {
  const port = c.pend && c.pend[id]; if (!port) return;
  port.postMessage({ t: 'done' }); delete c.pend[id]; c.ativos = Math.max(0, c.ativos - 1);
  const inf = c.info && c.info[id];
  if (inf) { if (tid <= 40 || performance.now() - inf.t > 2000) log('tunnel \u2190 ' + id + ' ' + inf.path.slice(0, 50) + ' ' + Math.round(inf.bytes / 1024) + ' KB in ' + Math.round(performance.now() - inf.t) + ' ms'); delete c.info[id]; }
  bomba(c);
}
function tunelResposta(c, dados) {
  if (typeof dados !== 'string') {                                   // frame binario: [tam id][id][ultimo][bytes]
    const v = new Uint8Array(dados), n = v[0], id = new TextDecoder().decode(v.subarray(1, 1 + n));
    const port = c.pend && c.pend[id]; if (!port) return;
    const corpo = v.slice(2 + n);                                      // copia: o buffer da mensagem nao e nosso
    if (corpo.length) { port.postMessage({ t: 'chunk', buf: corpo.buffer }, [corpo.buffer]); const inf = c.info && c.info[id]; if (inf) inf.bytes += corpo.length; }
    if (v[1 + n] === 1) tunelFim(c, id);
    return;
  }
  let m; try { m = JSON.parse(dados); } catch { return; }
  if (m.t !== 'res') return;
  const port = c.pend && c.pend[m.id];
  if (!port) { if (c.sonda && m.id === c.sonda.id) sondaResposta(c, m); return; }
  if (m.seq === 0) port.postMessage({ t: 'head', status: m.status, headers: m.headers || {} });
  if (m.body) { const bin = atob(m.body), u = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i); port.postMessage({ t: 'chunk', buf: u.buffer }, [u.buffer]); const inf = c.info && c.info[m.id]; if (inf) inf.bytes += u.length; }
  if (m.last) tunelFim(c, m.id);
}
// Que caminho a ligacao usa (direto / relay) e o RTT medido: explica lentidao e quedas.
async function caminho(pc) {
  try {
    const st = await pc.getStats(); let par = null; const locais = {}, remotos = {};
    st.forEach(r => { if (r.type === 'local-candidate') locais[r.id] = r; if (r.type === 'remote-candidate') remotos[r.id] = r; });
    st.forEach(r => { if (r.type === 'candidate-pair' && r.nominated && r.state === 'succeeded') par = r; });
    if (par) log('path: ' + (locais[par.localCandidateId] || {}).candidateType + ' <-> ' + (remotos[par.remoteCandidateId] || {}).candidateType + ', rtt ' + Math.round((par.currentRoundTripTime || 0) * 1000) + ' ms');
  } catch (e) { log('stats: ' + e); }
}
// Teste de velocidade (Details): N MB incompressiveis do proprio anfitriao (`/__speed`, sem Studio, sem disco, sem
// gzip) pelo canal, sem o service worker. Mbit/s medidos AQUI, do primeiro ao ultimo byte; mais o RTT e o par ICE.
async function parIce(pc) {
  try {
    const st = await pc.getStats(); let par = null; const loc = {}, rem = {};
    st.forEach(r => { if (r.type === 'local-candidate') loc[r.id] = r; if (r.type === 'remote-candidate') rem[r.id] = r; });
    st.forEach(r => { if (r.type === 'candidate-pair' && r.state === 'succeeded' && (r.nominated || r.selected) && (!par || r.nominated)) par = r; });
    if (!par) return 'path unknown';
    const l = loc[par.localCandidateId] || {}, r = rem[par.remoteCandidateId] || {};
    const tipo = c => (c.candidateType || '?') + (c.candidateType === 'relay' && c.relayProtocol ? '/' + c.relayProtocol : '');
    return tipo(l) + ' \u2194 ' + tipo(r) + ' ' + (l.protocol || r.protocol || '?') + ', RTT ' + (par.currentRoundTripTime != null ? Math.round(par.currentRoundTripTime * 1000) + ' ms' : '?');
  } catch (e) { return 'path unknown'; }
}
