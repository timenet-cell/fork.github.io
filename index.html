<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF3F8">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<title>Fork</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23EEF3F8'/%3E%3Cpath d='M24 14v14a8 8 0 0 0 16 0V14M32 36v16' stroke='%23e0312a' stroke-width='5' stroke-linecap='round' fill='none'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#EEF3F8;--panel:#F3F7FB;--card:#F8FAFC;--text:#141A22;--muted:#5B6675;--faint:#8A96A5;--line:#DCE4EC;--grid:#DCE5EE;
  --red:#e0312a;--red-ink:#fff;--field:#fff;--err:#b3261e;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
body{min-height:100dvh;display:flex;flex-direction:column}
a{color:var(--red)}
.hidden{display:none!important}

/* barra de cima, a moda de um terminal */
.bar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px max(16px,env(safe-area-inset-left));border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font:600 15px/1 var(--display);letter-spacing:-.01em;color:var(--text);text-decoration:none}
.logo svg{width:28px;height:28px}

.hero{text-align:center;padding:40px 16px 8px}
h1{font:700 clamp(34px,6.2vw,72px)/1.02 var(--display);letter-spacing:-.035em;margin:0}
.lede{color:var(--muted);font-size:clamp(15px,1.6vw,18px);margin:14px auto 0;max-width:34em}

/* o painel da rede */
.panel{position:relative;flex:1;margin:24px max(16px,env(safe-area-inset-left)) max(24px,env(safe-area-inset-bottom));border:1px solid var(--line);border-radius:18px;overflow:hidden;
  background-color:var(--panel);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:32px 32px;background-position:-1px -1px;min-height:700px}
#net{position:absolute;inset:0;width:100%;height:100%;display:block}
.center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:20px;pointer-events:none}
.center>*{pointer-events:auto}

.node{width:300px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 14px 12px;box-shadow:0 10px 30px rgba(20,40,70,.07)}
.tag{display:inline-block;font:600 10.5px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--red)}
.note{font-size:13px;color:var(--muted);margin:6px 0 10px}
.row{display:flex;gap:6px}
.row input{flex:1;min-width:0;font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--field);color:var(--text);outline:none}
.row input:focus{border-color:var(--red);box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 18%,transparent)}
.go{flex:none;font:600 13px/1 var(--sans);padding:0 11px;border:0;border-radius:9px;background:var(--red);color:var(--red-ink);cursor:pointer;white-space:nowrap}
.go[disabled]{opacity:.6;cursor:default}
.go:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.done{font-size:14px;font-weight:600;color:var(--text);margin:2px 0;padding:7px 0}
.done:focus{outline:none}
.cap{font:500 10.5px/1.4 var(--mono);letter-spacing:.03em;color:var(--faint);margin:8px 0 0}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hp{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}
.msg{font-size:12.5px;color:var(--err);margin:6px 0 0}
.msg:empty{display:none}

/* o grafo */
.lk{stroke:#C5D1DD;stroke-width:1}
.lk.hub{stroke:#B6C3D1;stroke-dasharray:3 4}
.nd{fill:var(--card);stroke:#9AA8B8;stroke-width:1.2}
.an{fill:var(--text)}
.ctr{fill:var(--red)}
.nl{font:500 11px var(--mono);fill:var(--muted)}
.cl{font:600 14px var(--display);fill:var(--text);letter-spacing:-.01em}
.cn{font:500 10px var(--mono);fill:var(--faint);letter-spacing:.06em}
.pulse{fill:var(--red)}
.cluster{cursor:pointer;outline:none}
.cluster .hit{fill:transparent}
#net.focus .lk,#net.focus .nd,#net.focus .nl,#net.focus .cl,#net.focus .an{opacity:.28;transition:opacity .2s}
#net .on .lk,#net .on .lk.hub{stroke:var(--red);opacity:1}
#net .on .nd{stroke:var(--red);opacity:1}
#net .on .an{fill:var(--red);opacity:1}
#net .on .nl,#net .on .cl{opacity:1}
#net .on .cl{fill:var(--red)}
.cluster:focus-visible .cl{text-decoration:underline}

/* telemovel e janelas estreitas: o anel em cima, os cartoes por baixo */
@media (max-width:1079px){
  .panel{min-height:0;display:flex;flex-direction:column;align-items:center;padding:0 0 20px}
  #net{position:relative;inset:auto;height:auto;aspect-ratio:1/1;max-width:560px}
  .center{position:relative;inset:auto;flex-direction:column;gap:14px;padding:0 14px;width:100%}
  .node{width:100%;max-width:340px}
  .hero{padding-top:28px}
}
@media (prefers-reduced-motion:reduce){</style>
</head>
<body>
<header class="bar">
  <a class="logo" href="./" aria-label="Fork home">
    <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#DCE5EE"/><path d="M14 22a14 14 0 0 0 0 16M50 22a14 14 0 0 1 0 16" stroke="#e0312a" stroke-opacity=".45" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M24 14v14a8 8 0 0 0 16 0V14M32 36v14" stroke="#e0312a" stroke-width="5" stroke-linecap="round" fill="none"/><circle cx="32" cy="51" r="3.5" fill="#e0312a"/></svg>
    Fork
  </a>
</header>

<section class="hero">
  <h1>Welcome To A New Era</h1>
  <p class="lede">Management tools for engineers, producers, labels, agents, events.</p>
</section>

<main class="panel" id="panel">
  <svg id="net" role="img" aria-label="ForkStudio, ForkManager, ForkLabels, ForkMusic and ForkEvents with their features"></svg>
  <div class="center">
    <div class="node" id="card">
      <span class="tag">Private beta</span>
      <p class="note">Invitations go out in small batches.</p>
      <form id="f-beta" class="row" autocomplete="on" novalidate>
        <label class="vh" for="b-email">Email</label>
        <input id="b-email" type="email" placeholder="Email" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="email" maxlength="254" required>
        <button class="go" id="b-go" type="submit">Request invite</button>
        <div class="hp" aria-hidden="true"><label for="b-site">Website</label><input id="b-site" type="text" tabindex="-1" autocomplete="off"></div>
      </form>
      <p class="done hidden" id="v-done" tabindex="-1">You’re on the list.</p>
      <div id="b-msg" class="msg" role="status" aria-live="polite"></div>
      <p class="cap">macOS · Windows · Linux · iOS · Android</p>
    </div>
  </div>
</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ── o grafo: cinco apps, cada uma com as suas funcoes, ligadas a uma conta ao centro ─────────────────────────────────
const APPS = [
  ['ForkStudio', ['Projects', 'Versions', 'Library', 'Samples', 'DJ']],
  ['ForkLabels', ['Releases', 'Catalog', 'Demos', 'Artists', 'Submissions']],
  ['ForkEvents', ['Events', 'Tickets', 'Line-ups']],
  ['ForkMusic', ['Listen', 'Collect', 'Support']],
  ['ForkManager', ['Gigs', 'Invoices', 'Press', 'Riders', 'Social']],
];
const NS = 'http://www.w3.org/2000/svg';
const net = document.getElementById('net');
const calmo = matchMedia('(prefers-reduced-motion: reduce)').matches;
let G = null, ativo = -1;

function el(tag, attrs, pai) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (pai) pai.appendChild(e);
  return e;
}

function desenha() {
  const W = net.clientWidth, H = net.clientHeight;
  if (!W || !H) return;
  const compacto = W < 760 || matchMedia('(max-width:1079px)').matches;
  net.setAttribute('viewBox', `0 0 ${W} ${H}`);
  net.textContent = '';
  const cx = W / 2, cy = H / 2;
  // Ancoras: um pentagono com um vertice em cima; no painel largo os de baixo abrem para os lados (os cartoes estao ao centro).
  const angs = [270, 342, 54, 126, 198];
  const rx = compacto ? W * 0.31 : W / 2 - 200, ry = compacto ? H * 0.31 : H / 2 - 115;
  const raio = compacto ? Math.max(28, W * 0.085) : 82;
  const lks = el('g', {}, net);
  const grupos = [], nos = [];
  el('circle', { cx, cy, r: compacto ? 9 : 6, class: 'ctr' }, net);
  APPS.forEach(([nome, funcs], i) => {
    const a = angs[i] * Math.PI / 180, ax = cx + rx * Math.cos(a), ay = cy + ry * Math.sin(a);
    const g = el('g', { class: 'cluster', tabindex: 0, role: 'button', 'aria-label': nome + ': ' + funcs.join(', ') }, net);
    const hub = el('line', { class: 'lk hub', x1: ax, y1: ay, x2: cx, y2: cy }, g);
    const n = funcs.length, abre = (compacto ? 150 : 140) * Math.PI / 180;
    const ps = funcs.map((f, k) => {
      const b = a + (n === 1 ? 0 : (k / (n - 1) - .5) * abre);
      return { x: ax + raio * Math.cos(b), y: ay + raio * Math.sin(b), b, f, ph: Math.random() * 6.28 };
    });
    // area de toque generosa (os nos sao pequenos)
    el('circle', { cx: ax + raio * .45 * Math.cos(a), cy: ay + raio * .45 * Math.sin(a), r: raio * 1.25, class: 'hit' }, g);
    ps.forEach(p => {
      p.ln = el('line', { class: 'lk', x1: ax, y1: ay, x2: p.x, y2: p.y }, g);
      p.c = el('circle', { cx: p.x, cy: p.y, r: compacto ? 3.2 : 4, class: 'nd' }, g);
      const dir = Math.cos(p.b) >= 0 ? 1 : -1;
      p.t = el('text', { x: p.x + dir * 9, y: p.y + 4, 'text-anchor': dir > 0 ? 'start' : 'end', class: 'nl' }, g);
      p.t.textContent = p.f;
      p.dir = dir;
      if (compacto) p.t.classList.add('hidden');
    });
    el('circle', { cx: ax, cy: ay, r: compacto ? 4.5 : 5.5, class: 'an' }, g);
    // o nome da app por baixo da ancora nas de cima e por cima nas de baixo (sempre longe dos cartoes do centro)
    const baixo = Math.sin(a) > 0.2, ly = baixo ? ay - (compacto ? 12 : 30) : ay + (compacto ? 20 : 24);
    const cl = el('text', { x: ax, y: ly, 'text-anchor': 'middle', class: 'cl' }, g);
    cl.textContent = nome;
    if (!compacto) { const cn = el('text', { x: ax, y: ly + 14, 'text-anchor': 'middle', class: 'cn' }, g); cn.textContent = n + ' FEATURES'; }
    const liga = () => foca(i), larga = () => foca(-1);
    g.addEventListener('mouseenter', liga);
    g.addEventListener('mouseleave', larga);
    g.addEventListener('focus', liga);
    g.addEventListener('blur', larga);
    g.addEventListener('click', e => { e.stopPropagation(); foca(ativo === i && e.pointerType !== 'mouse' ? -1 : i); });
    g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); foca(ativo === i ? -1 : i); } });
    grupos.push(g);
    nos.push({ ax, ay, ps, hub });
  });
  const pulsos = el('g', {}, net);
  G = { cx, cy, grupos, nos, pulsos, compacto, vivos: [] };
  foca(ativo);
}

function foca(i) {
  ativo = i;
  if (!G) return;
  net.classList.toggle('focus', i >= 0);
  G.grupos.forEach((g, k) => {
    g.classList.toggle('on', k === i);
    if (G.compacto) G.nos[k].ps.forEach(p => p.t.classList.toggle('hidden', k !== i));
  });
}
document.addEventListener('click', () => { if (ativo >= 0 && G && G.compacto) foca(-1); });

// Movimento discreto: os nos respiram e, de vez em quando, um sinal corre de uma funcao ate ao centro.
let ultimoPulso = 0;
function anima(t) {
  if (G && !document.hidden) {
    for (const c of G.nos) for (const p of c.ps) {
      const x = p.x + Math.sin(t / 1700 + p.ph) * 2.2, y = p.y + Math.cos(t / 2100 + p.ph) * 2.2;
      p.c.setAttribute('cx', x); p.c.setAttribute('cy', y);
      p.ln.setAttribute('x2', x); p.ln.setAttribute('y2', y);
      p.t.setAttribute('x', x + p.dir * 9); p.t.setAttribute('y', y + 4);
    }
    if (t - ultimoPulso > 1100) {
      ultimoPulso = t;
      const ci = ativo >= 0 ? ativo : Math.floor(Math.random() * G.nos.length), c = G.nos[ci], p = c.ps[Math.floor(Math.random() * c.ps.length)];
      G.vivos.push({ c, p, t0: t, d: el('circle', { r: 2.6, class: 'pulse' }, G.pulsos) });
    }
    G.vivos = G.vivos.filter(v => {
      const k = (t - v.t0) / 1800;
      if (k >= 1) { v.d.remove(); return false; }
      // 0..0.4: da funcao a ancora; 0.4..1: da ancora ao centro
      let x, y;
      if (k < .4) { const s = k / .4; x = v.p.x + (v.c.ax - v.p.x) * s; y = v.p.y + (v.c.ay - v.p.y) * s; }
      else { const s = (k - .4) / .6; x = v.c.ax + (G.cx - v.c.ax) * s; y = v.c.ay + (G.cy - v.c.ay) * s; }
      v.d.setAttribute('cx', x); v.d.setAttribute('cy', y);
      v.d.setAttribute('opacity', Math.min(1, (1 - k) * 3));
      return true;
    });
  }
  requestAnimationFrame(anima);
}
let espera;
new ResizeObserver(() => { clearTimeout(espera); espera = setTimeout(desenha, 60); }).observe(net);
desenha();
if (!calmo) requestAnimationFrame(anima);

// ── o pedido de convite (beta privada): so o email ─────────────────────────────────────────────────────────────────────
// So insere em `public.beta_requests` (RLS: o anon so insere; um email repetido e aceite em silencio, sem erro).
const SUPABASE_URL = "https://bxxscrkhcqdxgdhiuuoa.supabase.co";
const SUPABASE_KEY = "sb_publishable_iHR-1zNUsvPyL1czbALDmA_zCTW8Pd7";  // publishable key: public by design; access is enforced by Supabase row-level security
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false, autoRefreshToken: false } });
const $ = id => document.getElementById(id);

function diz(t) { $('b-msg').textContent = t || ''; }
function feito() {
  diz('');
  $('f-beta').classList.add('hidden');
  $('v-done').classList.remove('hidden');
  $('v-done').focus();
}
$('f-beta').onsubmit = async e => {
  e.preventDefault();
  diz('');
  // isca: so um robo preenche o campo escondido — diz-se que sim e nao se envia nada
  if ($('b-site').value) return feito();
  const email = $('b-email').value.trim();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) || email.length > 254) return diz('Type a valid email address.');
  $('b-go').disabled = true;
  try {
    const { error } = await sb.from('beta_requests').insert({ email, user_agent: navigator.userAgent.slice(0, 400) });
    if (error) throw error;
    feito();
  } catch (err) {
    diz(/fetch|network/i.test(err.message || '') ? 'You seem to be offline. Try again.' : 'Something went wrong. Try again.');
  } finally { $('b-go').disabled = false; }
};
</script>
</body>
</html>
